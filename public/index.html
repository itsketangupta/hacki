<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hacki</title>
  <link rel="icon" type="image/svg+xml" href="https://assets.hackclub.com/icon-rounded.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <!-- Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <!-- Collapsible ChatGPT-style Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-brand">
          <a href="https://hackclub.com" target="_blank" rel="noopener noreferrer" class="hc-logo-link" title="Hack Club">
            <img src="https://assets.hackclub.com/icon-rounded.svg" alt="Hack Club Logo" class="hc-logo">
          </a>
          <span class="sidebar-brand-name">Hacki</span>
          <button class="sidebar-toggle-btn" id="sidebar-close-btn" title="Close sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <button class="new-chat-btn" id="new-chat-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <span>New chat</span>
        </button>
      </div>

      <!-- Chat History List -->
      <div class="sidebar-chats" id="chat-history-list">
        <!-- Rendered dynamically -->
      </div>

      <!-- Bottom Nav Shortcuts -->
      <div class="sidebar-bottom">
        <button class="sidebar-nav-item" id="sidebar-team-btn">
          <span class="nav-icon">👥</span>
          <span>Team Directory</span>
        </button>
        <button class="sidebar-nav-item" id="sidebar-ysws-btn">
          <span class="nav-icon">🚀</span>
          <span>YSWS Programs</span>
        </button>
        <button class="sidebar-nav-item" id="sidebar-opps-btn">
          <span class="nav-icon">📢</span>
          <span>Slack Opportunities</span>
        </button>

        <!-- Hack Club Auth Section -->
        <div class="auth-section" id="auth-section">
          <!-- Logged out state -->
          <a href="/auth/login" class="hc-auth-btn" id="auth-login-btn">
            <img src="https://assets.hackclub.com/icon-rounded.svg" alt="HC" class="auth-btn-icon">
            <span>Sign in with Hack Club</span>
          </a>

          <!-- Logged in state -->
          <div class="user-profile-card" id="user-profile-card" style="display: none;">
            <div class="user-avatar" id="user-avatar">HC</div>
            <div class="user-details">
              <div class="user-name" id="user-name">Hack Clubber</div>
              <div class="user-sub" id="user-sub">Connected</div>
            </div>
            <a href="/auth/logout" class="user-logout-btn" title="Sign out">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Chat Workspace -->
    <main class="main-content">
      <!-- Top Minimal Header Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button" id="sidebar-open-btn" title="Open sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <line x1="9" y1="3" x2="9" y2="21"/>
            </svg>
          </button>
          
          <div class="model-badge">
            <img src="https://assets.hackclub.com/flag-standalone.svg" alt="HC" class="model-flag">
            <span class="model-title">Hacki</span>
            <span class="model-version">4o-mini</span>
          </div>
        </div>

        <div class="topbar-right">
          <button class="icon-button" id="new-chat-top-btn" title="New chat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 20h9"/>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Scrollable Conversation View -->
      <div class="conversation-container" id="conversation-container">
        <!-- Empty State (Shown only when chat is fresh, matches ChatGPT) -->
        <div class="empty-state" id="empty-state">
          <div class="empty-logo-wrap">
            <img src="https://assets.hackclub.com/icon-rounded.svg" alt="Hack Club Logo" class="empty-hc-logo">
          </div>
          <h2 class="empty-title">What can I help with today?</h2>
        </div>

        <!-- Messages stream -->
        <div class="messages-list" id="messages-list"></div>
      </div>

      <!-- ChatGPT-Style Floating Bottom Input Bar -->
      <div class="input-container">
        <div class="input-box">
          <button class="tools-btn" id="quick-tools-btn" title="Browse directories">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>

          <textarea
            id="chat-input"
            rows="1"
            placeholder="Message Hacki..."
            autofocus
          ></textarea>

          <button class="send-btn" id="send-btn" disabled title="Send message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"/>
              <polyline points="5 12 12 5 19 12"/>
            </svg>
          </button>
        </div>

        <div class="disclaimer">
          Hacki can make mistakes. Check verified Hack Club sources on Slack &amp; <a href="https://hackclub.com" target="_blank">hackclub.com</a>.
        </div>
      </div>
    </main>
  </div>

  <!-- Modal / Drawer for Team, YSWS, and Opportunities -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">Directory</h3>
        <button class="modal-close-btn" id="modal-close-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-search-bar">
        <input type="text" id="modal-search-input" placeholder="Search...">
      </div>
      <div class="modal-content" id="modal-content">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
